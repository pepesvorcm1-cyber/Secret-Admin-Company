<script>

/* =========================
   NAVIGATION
========================= */

function goTo(id) {

    document
    .getElementById(id)
    .scrollIntoView({
        behavior: "smooth"
    });

}


/* =========================
   REGISTER
========================= */

function openRegister() {

    document
    .getElementById("registerModal")
    .style.display = "flex";

}


function closeRegister() {

    document
    .getElementById("registerModal")
    .style.display = "none";

}


function registerUser() {

    const username =
        document
        .getElementById("registerUsername")
        .value
        .trim();


    const password =
        document
        .getElementById("registerPassword")
        .value;


    const confirm =
        document
        .getElementById("registerConfirm")
        .value;


    const message =
        document
        .getElementById("registerMessage");


    if (
        !username ||
        !password ||
        !confirm
    ) {

        message.innerText =
        "Please fill in all fields.";

        return;
    }


    if (
        password !== confirm
    ) {

        message.innerText =
        "Passwords do not match.";

        return;
    }


    let users =
        JSON.parse(
            localStorage
            .getItem("sac_users")
            || "[]"
        );


    if (
        users.some(
            user =>
            user.username === username
        )
    ) {

        message.innerText =
        "Username already exists.";

        return;
    }


    users.push({

        username: username,

        password: password

    });


    localStorage.setItem(
        "sac_users",
        JSON.stringify(users)
    );


    message.innerText =
    "Account created successfully.";

}


/* =========================
   LOGIN
========================= */

function openLogin() {

    document
    .getElementById("loginModal")
    .style.display = "flex";

}


function closeLogin() {

    document
    .getElementById("loginModal")
    .style.display = "none";

}


function loginUser() {

    const username =
        document
        .getElementById("loginUsername")
        .value
        .trim();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    const message =
        document
        .getElementById("loginMessage");


    let users =
        JSON.parse(
            localStorage
            .getItem("sac_users")
            || "[]"
        );


    const user =
        users.find(
            u =>
            u.username === username &&
            u.password === password
        );


    if (!user) {

        message.innerText =
        "Incorrect username or password.";

        return;
    }


    localStorage.setItem(
        "sac_logged_user",
        username
    );


    document
    .getElementById("currentUser")
    .innerText = username;


    document
    .getElementById("userPanel")
    .style.display = "block";


    closeLogin();

}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "sac_logged_user"
    );


    document
    .getElementById("userPanel")
    .style.display = "none";

}


/* =========================
   ADD COMPANY
========================= */

function openCompany() {

    document
    .getElementById("companyModal")
    .style.display = "flex";

}


function closeCompany() {

    document
    .getElementById("companyModal")
    .style.display = "none";

function addCompany() {

    const name =
        document
        .getElementById("companyName")
        .value;


    if (!name) {

        alert(
            "Enter a company name."
        );

        return;
    }


    const money =
        document
        .getElementById("companyMoney")
        .value;


    const date =
        document
        .getElementById("companyDate")
        .value;


    const owner =
        document
        .getElementById("companyOwner")
        .value;


    const description =
        document
        .getElementById("companyDescription")
        .value;


    const card =
        document.createElement("div");


    card.className = "card";


    card.innerHTML = `

        <h3>${name}</h3>

        <p>
        Revenue: ${money}
        </p>

        <p>
        Created: ${date}
        </p>

        <p>
        Owner: ${owner}
        </p>

        <p>
        ${description}
        </p>

    `;


    document
    .getElementById("companyList")
    .appendChild(card);


    closeCompany();

}


/* =========================

function addAction() {

    const name =
        document

    const description =
        document
        .getElementById("actionDescription")
        .value;


    if (!name) {

        alert(

    const card =
        document.createElement("div");


    card.className = "card";


    card.innerHTML = `

        ${description}
        </p>

    `;


    document
    .getElementById("actionList")
    .appendChild(card);


    closeAction();

}


/* =========================
   REMEMBER LOGIN
========================= */

const savedUser =

if (savedUser) {

    .getElementById("currentUser")
    .innerText = savedUser;


    document
    .getElementById("userPanel")

/* =========================
   CLOSE MODALS
========================= */

function(event) {

    if (
        event.target
        .classList
        .contains("modal")
    ) {

        event.target.style.display =
        "none";

    }

};
